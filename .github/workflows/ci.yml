name: CI

on:
  push:
    branches: [main, dev-wsm]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests app
      - name: Test
        # Warning library dianggap error agar API yang usang ketahuan lebih awal
        run: pytest -q -W error::UserWarning -W error::FutureWarning -W error::DeprecationWarning
